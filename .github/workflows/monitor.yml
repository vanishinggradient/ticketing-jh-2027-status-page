name: Monitor Tickets

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 min (TESTING - revert to hourly after confirmed)
  workflow_dispatch:

concurrency:
  group: ticket-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r cron/requirements.txt

      - name: Run monitor
        run: python cron/monitor.py
        env:
          KONFHUB_EVENT_ID: ${{ secrets.KONFHUB_EVENT_ID }}
          KONFHUB_REFRESH_TOKEN: ${{ secrets.KONFHUB_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_PHASE_FLIP: ${{ secrets.ENABLE_PHASE_FLIP }}
          MONITOR_MODE: ${{ secrets.MONITOR_MODE }}

      - name: Commit status
        run: |
          git config user.name "Ticket Monitor"
          git config user.email "ticketing@japanhabba.org"
          git add status.json
          git diff --staged --quiet || (git commit -m "status: $(date -u +%Y-%m-%d_%H:%M)" && git push)
