name: Monitor Tickets

on:
  workflow_dispatch:

concurrency:
  group: ticket-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r cron/requirements.txt

      - name: Run monitor
        run: python cron/monitor.py
        env:
          KONFHUB_EVENT_ID: ${{ secrets.KONFHUB_EVENT_ID }}
          KONFHUB_REFRESH_TOKEN: ${{ secrets.KONFHUB_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_PHASE_FLIP: ${{ secrets.ENABLE_PHASE_FLIP }}
          MONITOR_MODE: ${{ secrets.MONITOR_MODE }}

      - name: Generate comparison report
        run: python cron/generate_report.py

      - name: Scrape Instagram announcements
        run: python cron/scrape_ig.py
        env:
          INSTAGRAM_SESSION_B64: ${{ secrets.INSTAGRAM_SESSION_B64 }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
        continue-on-error: true

      - name: Commit status
        run: |
          git config user.name "Ticket Monitor"
          git config user.email "ticketing@japanhabba.org"
          git add status.json history.json events.json comparison.xlsx
          git diff --staged --quiet || (git commit -m "status: $(date -u +%Y-%m-%d_%H:%M)" && git push)
