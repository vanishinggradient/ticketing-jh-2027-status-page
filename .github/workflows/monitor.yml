name: Monitor Tickets

on:
  workflow_dispatch:

concurrency:
  group: ticket-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r cron/requirements.txt

      - name: Decrypt state
        run: python cron/vault.py decrypt
        env:
          PAGE_USERNAME: ${{ secrets.PAGE_USERNAME }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}

      - name: Run monitor
        run: bash cron/quiet.sh python cron/monitor.py
        env:
          KONFHUB_EVENT_ID: ${{ secrets.KONFHUB_EVENT_ID }}
          KONFHUB_REFRESH_TOKEN: ${{ secrets.KONFHUB_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_PHASE_FLIP: ${{ secrets.ENABLE_PHASE_FLIP }}
          MONITOR_MODE: ${{ secrets.MONITOR_MODE }}

      - name: Generate comparison report
        run: bash cron/quiet.sh python cron/generate_report.py

      - name: Encrypt state
        run: python cron/vault.py encrypt
        env:
          PAGE_USERNAME: ${{ secrets.PAGE_USERNAME }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}

      - name: Commit status
        run: |
          git config user.name "Ticket Monitor"
          git config user.email "ticketing@japanhabba.org"
          git add status.enc history.enc events.enc
          # events.enc is pushed by the local job (cron/local_events.sh); rebase over it
          git diff --staged --quiet || (git commit -m "status: $(date -u +%Y-%m-%d_%H:%M)" && git pull --rebase -q && git push)

      # Only public files go to Pages; plaintext json and cron/ never get served
      - name: Stage site
        run: |
          mkdir _site
          cp index.html *.enc _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Keyless: WIF impersonates a service account whose only access is
      # Editor on the team sheet. Runs last so a failure can't lose data.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Update Google Sheet
        run: bash cron/quiet.sh python cron/update_sheet.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
