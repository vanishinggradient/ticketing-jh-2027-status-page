name: Monitor Tickets

on:
  workflow_dispatch:

concurrency:
  group: ticket-monitor
  cancel-in-progress: true

jobs:
  # Reads the KonfHub + page credentials and writes the encrypted state.
  # Runs inside the protected `production` environment (main only), so a
  # workflow dispatched from a branch cannot reach the secrets.
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - run: pip install -r cron/requirements.txt

      # Encrypted state lives on the `state` branch so `main` can stay
      # pull-request-only. Fall back to the copies on main on first run.
      - name: Restore state
        run: |
          if git fetch origin state; then
            for f in status.enc history.enc; do
              git show FETCH_HEAD:$f > "$f" 2>/dev/null || git checkout HEAD -- "$f"
            done
            echo "Restored state from the state branch."
          else
            echo "No state branch yet, using the copies on main."
          fi

      - name: Decrypt state
        run: python cron/vault.py decrypt
        env:
          PAGE_USERNAME: ${{ secrets.PAGE_USERNAME }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}

      - name: Run monitor
        run: bash cron/quiet.sh python cron/monitor.py
        env:
          KONFHUB_EVENT_ID: ${{ secrets.KONFHUB_EVENT_ID }}
          KONFHUB_REFRESH_TOKEN: ${{ secrets.KONFHUB_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_PHASE_FLIP: ${{ secrets.ENABLE_PHASE_FLIP }}
          MONITOR_MODE: ${{ secrets.MONITOR_MODE }}

      - name: Generate comparison report
        run: bash cron/quiet.sh python cron/generate_report.py

      - name: Encrypt state
        run: python cron/vault.py encrypt
        env:
          PAGE_USERNAME: ${{ secrets.PAGE_USERNAME }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}

      # Pushes to `state`, never to `main`. `main` is protected by a ruleset
      # that requires a pull request, so no workflow gets a bypass token.
      - name: Save state
        run: |
          git config user.name "Ticket Monitor"
          git config user.email "ticketing@japanhabba.org"
          wt=/tmp/state
          if git fetch origin state; then
            git worktree add -q -B state "$wt" "$(git rev-parse FETCH_HEAD)"
          else
            git worktree add -q --orphan -B state "$wt"
          fi
          cp status.enc history.enc "$wt"/
          git -C "$wt" add -A
          if git -C "$wt" diff --staged --quiet; then
            echo "State unchanged, nothing to commit."
          else
            git -C "$wt" commit -q -m "status: $(date -u +%Y-%m-%d_%H:%M)"
            git -C "$wt" push -q origin state
          fi

      # Only public files go to Pages; plaintext json and cron/ never get served
      - name: Stage site
        run: |
          mkdir _site
          cp index.html *.enc _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Keyless: WIF impersonates a service account whose only access is
      # Editor on the team sheet. Runs last so a failure can't lose data.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Update Google Sheet
        run: bash cron/quiet.sh python cron/update_sheet.py
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
